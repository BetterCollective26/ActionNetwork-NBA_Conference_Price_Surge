<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Action Network NBA Family Cost Menu</title>
  <style>
    :root {
      --an-ink: #111827;
      --an-muted: #5b6471;
      --an-line: #dce7df;
      --an-green: #00c853;
      --an-green-dark: #009640;
      --an-dark: #07130d;
      --an-soft: #f4faf6;
      --an-white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--an-ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .an-sticky-nav {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 0;
    }

    .an-sticky-nav__inner {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px;
      background:
        linear-gradient(180deg, rgba(244, 250, 246, .98) 0%, rgba(255, 255, 255, .98) 100%);
      border: 1px solid var(--an-line);
      box-shadow: 0 10px 24px rgba(17, 24, 39, .06);
    }

    .an-sticky-nav__link {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 16px;
      background: var(--an-white);
      border: 1px solid var(--an-line);
      color: var(--an-ink);
      text-decoration: none;
      font-size: 15px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.01em;
      transition: background .16s ease, border-color .16s ease, transform .16s ease, box-shadow .16s ease;
    }

    .an-sticky-nav__link:hover,
    .an-sticky-nav__link:focus {
      background: #fbfffc;
      border-color: rgba(0, 200, 83, .45);
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(0, 200, 83, .08);
      outline: none;
    }

    .an-sticky-nav__link.is-active {
      background: var(--an-dark);
      color: #ffffff;
      border-color: var(--an-dark);
    }

    .an-sticky-nav__link.is-active:hover,
    .an-sticky-nav__link.is-active:focus {
      background: #10261a;
      border-color: #10261a;
    }

    .an-sticky-nav__number {
      width: 24px;
      height: 24px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      background: var(--an-green);
      color: #07130d;
      font-size: 12px;
      font-weight: 950;
      line-height: 1;
    }

    .an-sticky-nav__text {
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      .an-sticky-nav__inner {
        gap: 8px;
        padding: 8px;
      }

      .an-sticky-nav__link {
        min-height: 48px;
        padding: 12px 10px;
        font-size: 13px;
      }

      .an-sticky-nav__number {
        width: 21px;
        height: 21px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <nav class="an-sticky-nav" aria-label="NBA family cost article sections">
    <div class="an-sticky-nav__inner">
      <a class="an-sticky-nav__link is-active" href="https://www.actionnetwork.com/nba/the-most-expensive-and-most-affordable-nba-games-for-families-in-2025#regular-season" target="_top">
        <span class="an-sticky-nav__number">1</span>
        <span class="an-sticky-nav__text">Regular Season</span>
      </a>

      <a class="an-sticky-nav__link" href="https://www.actionnetwork.com/nba/the-most-expensive-and-most-affordable-nba-games-for-families-in-2025#conference-finals" target="_top">
        <span class="an-sticky-nav__number">2</span>
        <span class="an-sticky-nav__text">Conference Finals</span>
      </a>
    </div>
  </nav>
</body>
</html>
